[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triplepass-prove"
version = "0.1.0a1"
description = "Standalone evaluation receipts with independently checkable artifact and timestamp evidence"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{name = "Christopher Ayers"}]
dependencies = ["rfc8785==0.1.4", "opentimestamps==0.5.0", "python-bitcoinlib==0.12.2", "jsonschema==4.26.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
prove = "prove.cli:main"

[project.urls]
Repository = "https://github.com/TriplePassLabs/prove"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prove = ["data/schemas/*.json", "data/conformance/*.json", "data/conformance/*.md",
         "data/conformance/cases/*.json", "data/examples/basic/*.json",
         "data/examples/basic/*.md", "data/examples/basic/outputs/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
